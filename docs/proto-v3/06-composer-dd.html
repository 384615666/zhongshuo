<style>
/* ── 输入条（主池 + 线程共用） ── */
.cbox{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-s);padding:9px 11px 7px;transition:border .12s,box-shadow .12s;
}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.cbox-top{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface3);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;font-size:11px;font-weight:700;color:var(--ink2);padding:3px 11px;border-radius:6px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);

}
.chip:hover{border-color:var(--ink3)}
.chip.on{border-style:solid;border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.route-hint{margin-left:auto;font-size:10.5px;color:var(--ink3)}
.route-hint b{color:var(--violet);font-weight:700}
.cbox textarea{
  width:100%;display:block;border:0;outline:0;resize:none;font-family:inherit;font-size:13.5px;

.cbox-bot .sp{flex:1}

.cap-note .d{width:6px;height:6px;border-radius:50%;background:var(--amber)}

}
.send:hover{background:var(--accent-h)}
.send svg{width:13px;height:13px}
/* 主池输入区 */
.pool-composer{flex:none;padding:10px 14px 13px}

.dd{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.dd-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.dd-h .sub{font-size:11.5px;color:var(--ink3);width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-s);overflow:hidden}

.card-h .t{font-size:13px;font-weight:800}
.card-h .sub{font-size:11px;color:var(--ink3);margin-left:2px}

.stage-flow{display:flex;padding:14px 16px;gap:0}
.sf{flex:1;display:flex;flex-direction:column;gap:6px;padding:0 10px;border-left:1px solid var(--border);position:relative}
.sf:first-child{border-left:0}

.sf.done .dot{background:var(--green-soft);color:var(--green)}
.sf.now .dot{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}

.sf.done .nm{color:var(--green)} .sf.now .nm{color:var(--accent-ink)}
.sf .ds{font-size:10.5px;color:var(--ink3);line-height:1.5}

.mx-table{width:100%;border-collapse:collapse;font-size:12px}
