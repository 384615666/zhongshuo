<style>
/* ── 主区：对话池（收窄）+ 线程（主区） ── */
.main{flex:1;display:flex;min-width:0;min-height:0}
.view{display:none;flex:1;min-width:0;min-height:0}
.view.active{display:flex}
/* 对话池：线程打开时收窄成摘要列 */
.pool{
  flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
  transition:flex .22s ease;
}
.pool.shrunk{flex:0 0 392px;border-right:1px solid var(--border)}
.pool-head{
  flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--border);background:var(--surface);
}
.pool-head .rh .n{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.pool-head .rh .d{font-size:11.5px;color:var(--ink3);margin-top:2px}
.pool-head .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.pool-body{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
.day-div{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:10.5px;margin:6px 0;letter-spacing:.5px}
.day-div::before,.day-div::after{content:"";flex:1;height:1px;background:var(--border)}
/* 顶层消息卡 */
.msg{
  display:flex;gap:10px;padding:12px 13px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--border);background:var(--surface);transition:.12s;
}
.msg:hover{box-shadow:var(--shadow);border-color:var(--border2)}
.msg.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.msg-main{flex:1;min-width:0}
.msg-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.msg-head .au{font-weight:700;font-size:12.5px}
.msg-head .tm{font-size:10.5px;color:var(--ink3)}
.msg-text{margin-top:4px;font-size:13px;line-height:1.6}
.msg-text .mt{color:var(--accent-ink);font-weight:600}
.msg-text .mt.v{color:var(--violet)}
/* 回复预览投影 */
.msg-pv{
  margin-top:8px;border-left:2px solid var(--border2);padding:2px 0 2px 10px;
  display:flex;flex-direction:column;gap:4px;
}
.pv{display:flex;gap:6px;font-size:11.5px;color:var(--ink2);align-items:baseline}
.pv .who{font-weight:700;flex:none}
.pv .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-foot{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rcnt{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent-ink);font-weight:700}
.avs{display:flex}
.avs .av{margin-left:-5px;border:2px solid var(--surface)}
.avs .av:first-child{margin-left:0}
.mini{font-size:10.5px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px}
.sys-note{align-self:center;font-size:10.5px;color:var(--ink3);background:var(--surface3);border-radius:99px;padding:3px 12px}
</style>
