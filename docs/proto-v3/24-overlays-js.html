<div class="toast" id="toast"></div>

<script>
// 主题切换（浅色/深色）
function toggleTheme(){
  const h=document.documentElement;
  const dark=h.dataset.theme==='dark';
  h.dataset.theme=dark?'light':'dark';
  document.querySelector('#themeIco use').setAttribute('href',dark?'#i-moon':'#i-sun');
  toast(dark?'已切到浅色主题':'已切到深色主题');
}
// 视图切换
const navItems=document.querySelectorAll('.sb-item[data-view]');
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));
  navItems.forEach(i=>i.classList.toggle('active',i.dataset.view===name));
}
navItems.forEach(i=>i.addEventListener('click',()=>switchView(i.dataset.view)));
// 线程开合：打开时对话池收窄
function openThread(){document.getElementById('thread').classList.add('open');document.getElementById('pool').classList.add('shrunk')}
function closeThread(){document.getElementById('thread').classList.remove('open');document.getElementById('pool').classList.remove('shrunk')}
// 线程详情抽屉
function toggleDetail(){document.getElementById('thDetail').classList.toggle('open')}
// 任务/讨论切换
function segSel(btn){btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');toast(btn.textContent==='讨论'?'已切到「讨论」：保存但不调用模型（E1 可开回复串）':'已切到「任务」：按 @ 结构自动路由')}
// Ctrl+K
const cmdk=document.getElementById('cmdk');
function openCmdk(){cmdk.classList.add('open');setTimeout(()=>document.getElementById('cmdkInput').focus(),30)}
function closeCmdk(){cmdk.classList.remove('open')}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdk.classList.contains('open')?closeCmdk():openCmdk()}
  if(e.key==='Escape'){closeCmdk();closeResume()}
});
// 恢复弹窗
function closeResume(){document.getElementById('resumeModal').classList.remove('open')}
// toast
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
// 深链
const q=new URLSearchParams(location.search);
if(q.get('resume')==='1')document.getElementById('resumeModal').classList.add('open');
if(q.get('view'))switchView(q.get('view'));
if(q.get('thread')==='0')closeThread();
if(q.get('theme')==='dark')toggleTheme();
</script>
