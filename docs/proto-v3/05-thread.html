<style>
/* ── 线程面板：占主区，头部折叠 ── */
.thread{
  flex:1;display:none;flex-direction:column;min-width:0;min-height:0;background:var(--bg);
}
.thread.open{display:flex}
/* 顶部一行：标题 + 模式 + 状态 + 操作 */
.th-top{
  flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid var(--border);background:var(--surface);
}
.th-top .ti{font-size:15px;font-weight:800}
.th-top .sub{font-size:11px;color:var(--ink3)}
.th-top .acts{margin-left:auto;display:flex;gap:4px;align-items:center}
/* 阶段胶囊条（一行，不占高度） */
.stage-strip{
  flex:none;display:flex;align-items:center;gap:2px;padding:7px 16px;
  border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;
}
.stp{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);white-space:nowrap;padding:3px 9px;border-radius:99px}
.stp .n{width:15px;height:15px;border-radius:50%;background:var(--surface3);color:var(--ink3);font-size:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.stp.done{color:var(--green)} .stp.done .n{background:var(--green-soft);color:var(--green)}
.stp.now{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.stp.now .n{background:var(--accent);color:#fff}
.stp-arrow{color:var(--border2);font-size:10px;flex:none}
.strip-sep{width:1px;height:16px;background:var(--border);margin:0 6px;flex:none}
.strip-info{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap;padding:3px 4px}
.strip-info b{font-weight:700}
.strip-info .budget{width:64px;height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;display:inline-block}
.strip-info .budget i{display:block;height:100%;background:var(--amber)}
/* 可展开详情抽屉 */
.th-detail{display:none;border-bottom:1px solid var(--border);background:var(--surface);padding:10px 16px 12px}
.th-detail.open{display:block}
.td-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12px}
.td-row{display:flex;gap:8px;align-items:center}
.td-row .k{color:var(--ink3);width:64px;flex:none;font-size:11px}
/* 消息区：主角 */
.th-body{flex:1;overflow-y:auto;padding:16px 20px 10px;display:flex;flex-direction:column;gap:14px}
.rmsg{display:flex;gap:10px}
.rmsg .rm-main{flex:1;min-width:0}
.rmsg .rm-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rmsg .rm-head .au{font-weight:700;font-size:12.5px}
.rmsg .rm-head .tm{font-size:10.5px;color:var(--ink3)}
.rmsg .rm-text{margin-top:4px;font-size:13.5px;line-height:1.7}
.rm-text .mono{font-size:11.5px}
/* 成果卡 */
.af-card{
  margin-top:8px;border:1px solid var(--border);border-radius:var(--r-s);overflow:hidden;
  background:var(--surface);max-width:640px;
}
.af-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:700}
.af-b{padding:9px 12px;font-size:12.5px;color:var(--ink2);line-height:1.65}
.af-f{padding:7px 12px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{font-size:10.5px;color:var(--ink2);background:var(--surface3);border-radius:5px;padding:2px 7px}
.link{color:var(--accent-ink);cursor:pointer;font-size:11.5px;font-weight:600}
.link:hover{text-decoration:underline}
/* 互评立场 */
.rl{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.rl:last-child{border-bottom:0}
.stance{flex:none;font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;margin-top:1px}
.st-ok{background:var(--green-soft);color:var(--green)}
.st-no{background:var(--red-soft);color:var(--red)}
.st-need{background:var(--amber-soft);color:var(--amber)}
/* 缺席 / 提示条 */
.notice{
  border-radius:var(--r-s);padding:9px 13px;font-size:12px;display:flex;flex-direction:column;gap:5px;
  border:1px solid;
}
.notice.amber{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent);color:var(--ink)}
.notice .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sys-ev{align-self:center;font-size:10.5px;color:var(--ink3);background:var(--surface3);border-radius:99px;padding:3px 12px;text-align:center}
/* 串内输入 */
.th-composer{flex:none;border-top:1px solid var(--border);padding:10px 16px 14px;background:var(--surface)}
</style>
