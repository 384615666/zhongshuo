# Original Zhongshuo surface over the official base bundle. No OpenDesign code.
- id: hmr
  disabled: true
- id: session-title-llm
  disabled: true
# Only the connector's new sessions use these roots. Credentials, providers,
# MCP and skills still resolve through the existing Harness home and profile.
# Existing session IDs explicitly select the original roots in the adapter.
- id: session-persistence-jsonl
  config:
    root: !!js "process.env.ZHONGSHUO_DSH_PRIVATE_SESSIONS === '1' ? dshHomePath('connectors', 'zhongshuo', 'sessions') : dshHomePath('sessions')"
- id: storage-json
  config:
    root: !!js "process.env.ZHONGSHUO_DSH_PRIVATE_SESSIONS === '1' ? dshHomePath('connectors', 'zhongshuo', 'storages') : dshHomePath('storages')"
- id: sandbox-policy
  config:
    mode: danger-full-access
- id: approval
  config:
    policy: never
- insert:
    - id: zhongshuo-stdio
      name: '@zhongshuo/dsh-runtime'
